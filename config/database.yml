# MySQL. Versions 5.5.8 and up are supported.
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>

development:
  <<: *default
  database: vital_connect_development

test:
  <<: *default
  database: vital_connect_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE") { "vital_connect_production" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "vital_connect" } %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
