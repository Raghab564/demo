apiVersion: apps/v1
kind: Deployment
metadata:
  name: vital-connect-api
  labels:
    app: vital-connect-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vital-connect-api
  template:
    metadata:
      labels:
        app: vital-connect-api
    spec:
      containers:
        - name: vital-connect-api
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/vital-connect-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: vital-connect-config
            - secretRef:
                name: vital-connect-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vital-connect-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vital-connect-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
