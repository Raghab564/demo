apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
data:
  RAILS_ENV: "production"
  RAILS_LOG_TO_STDOUT: "true"
  # In AWS this would be an RDS Aurora MySQL endpoint and an MSK bootstrap
  # broker list, not in-cluster services.
  DB_HOST: "demo-mysql"
  DB_USERNAME: "demo"
  DB_DATABASE: "demo_production"
  KAFKA_BROKERS: "demo-kafka:9092"
  KAFKA_TELEMETRY_TOPIC: "telemetry.readings"
  OIDC_ISSUER: "https://mock-idp.demo.local/"
  OIDC_AUDIENCE: "demo-api"
