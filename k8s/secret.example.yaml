# Example only — do not commit real secrets. In AWS, populate this Secret via
# External Secrets Operator / the Secrets Store CSI driver backed by AWS
# Secrets Manager rather than applying literal values like this.
apiVersion: v1
kind: Secret
metadata:
  name: demo-secrets
type: Opaque
stringData:
  DB_PASSWORD: "changeme"
  RAILS_MASTER_KEY: "changeme"
  OIDC_SHARED_SECRET: "changeme"
